services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: zoo
      POSTGRES_PASSWORD: zoo
      POSTGRES_DB: zoo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoo -d zoo"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build: ./backend

    environment:
      DATABASE_URL: postgresql://zoo:zoo@db:5432/zoo

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build: ./frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: